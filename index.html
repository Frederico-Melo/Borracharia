<!DOCTYPE html>
<html>
<head>
  <title>Borracharia</title>

  <style>
    body {
      font-family: Arial;
      background: #f5f5f5;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    .box {
      background: white;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    input, button {
      padding: 10px;
      margin: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }

    li {
      margin: 5px 0;
    }
  </style>
</head>
<body>

<h1>Sistema Borracharia</h1>

<div class="box">
  <h2>Estoque</h2>

  <input id="nome" placeholder="Produto">
  <input id="qtd" placeholder="Quantidade">
  <input id="preco" placeholder="Preço">

  <button onclick="adicionarProduto()">Adicionar</button>

  <ul id="lista"></ul>
</div>

<div class="box">
  <h2>Vendas</h2>

  <input id="produtoVenda" placeholder="Produto">
  <input id="qtdVenda" placeholder="Quantidade">

  <button onclick="vender()">Registrar Venda</button>

  <ul id="listaVendas"></ul>
</div>

<script>
let produtos = JSON.parse(localStorage.getItem("produtos")) || [];
let vendas = JSON.parse(localStorage.getItem("vendas")) || [];

function salvar() {
  localStorage.setItem("produtos", JSON.stringify(produtos));
  localStorage.setItem("vendas", JSON.stringify(vendas));
}

function adicionarProduto() {
  let nome = document.getElementById("nome").value;
  let qtd = parseInt(document.getElementById("qtd").value);
  let preco = parseFloat(document.getElementById("preco").value);

  produtos.push({ nome, qtd, preco });

  salvar();
  mostrar();
}

function vender() {
  let nome = document.getElementById("produtoVenda").value;
  let qtdVenda = parseInt(document.getElementById("qtdVenda").value);

  let produto = produtos.find(p => p.nome === nome);

  if (!produto) {
    alert("Produto não encontrado!");
    return;
  }

  if (produto.qtd < qtdVenda) {
    alert("Estoque insuficiente!");
    return;
  }

  produto.qtd -= qtdVenda;

  vendas.push({
    nome,
    qtd: qtdVenda,
    total: qtdVenda * produto.preco
  });

  salvar();
  mostrar();
}

function mostrar() {
  let lista = document.getElementById("lista");
  lista.innerHTML = "";

  produtos.forEach(p => {
    let item = document.createElement("li");
    item.innerText = `${p.nome} - ${p.qtd} - R$${p.preco}`;
    lista.appendChild(item);
  });

  let listaVendas = document.getElementById("listaVendas");
  listaVendas.innerHTML = "";

  vendas.forEach(v => {
    let item = document.createElement("li");
    item.innerText = `${v.nome} - ${v.qtd} - R$${v.total}`;
    listaVendas.appendChild(item);
  });
}

mostrar();
</script>

</body>
</html>
